# Item vocabulary learned from the live game, anchored to D2 ITEM CODES.
#
# GENERATED, but meant to be READ: a code is checkable against any D2
# reference in seconds, which a kind id is not. That is the whole point
# of R144. Kinds are renumbered every PD2 season and resolve at load
# time through config/item_codes.toml (regenerate with the T42 drill).
#
# R128 approved 53 proposed ids by eye and SIX elite armours were wrong —
# the bot picked up a Wire Fleece believing it was a Kraken Shell, and
# could never pick up a real one. Reviewing numbers is not a question a
# human can answer; reviewing codes is.

