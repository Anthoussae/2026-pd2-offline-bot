# The poison dagger necromancer — everything class-specific in one file.
#
# This file is meant to be READ AND TUNED BY A HUMAN (R46 Q3). Every number
# here was user-approved at R49 (with the R53 belt layout and the 15 s mana
# cooldown amendment); change them here, never in code. The loader refuses
# unknown keys loudly, so a typo fails at startup instead of silently
# defaulting mid-run.

name = "necromancer"

# Skill ids as captured LIVE from this character (P1 drill A, R52). These
# are PD2's ids, which differ from classic D2 in places (blood warp 367,
# desecrate 83 in a classic slot).
[skills]
poison_strike = 73 # the permanent left skill; offense never switches (R47)
bone_armor = 68
blood_warp = 367
tp_tome = 220      # bound but unused in M5
bone_wall = 78     # bound but unused in M5
desecrate = 83
revive = 95

# Right-skill hotkeys as bound in the client (R47.1). If the in-game
# bindings change, change these to match — the bot presses these keys and
# then VERIFIES the switch from memory before any cast (skills.py).
[hotkeys]
bone_armor = "F1"
blood_warp = "F2"
tp_tome = "F3"
bone_wall = "F4"
desecrate = "F5"
revive = "F6"

# The PERMANENT belt layout (user declaration, R53 — supersedes R47.6):
# key 1 mana, key 2 rejuv, keys 3+4 healing. Columns are listed left to
# right; the drink keys are the column number plus one. The minimums are
# the town layer's loud-halt floor after a refill (R48: no vendor UI —
# below minimum means halt for a manual restock).
[belt]
columns = ["mana", "rejuv", "healing", "healing"]
min_healing = 4
min_mana = 2
min_rejuv = 0 # rejuvs cannot be bought; advisory only (R47.6)

# The survival reflex ladder (R49). Rungs, top priority first:
#   1 death latch, 2 chicken     -> SafetyMonitor's, not the ladder's
#   3 rejuv, 4 blood warp, 5 heal potion, 6 mana potion,
#   7 disengage, 8 upkeep        -> the ladder's, numbers below
# The ladder only runs OUT of town (town guards read as monsters to
# perception, and drink rules are out-of-town only) — except the armor
# recast, see armor_in_town.
[reflex]
# Rung 2 — the chicken threshold. Listed here because the user tunes it
# with the rest, but it is enforced by SafetyMonitor, not the ladder.
chicken_life_pct = 35.0

# Rung 3 — rejuv: below this hp%, drink the rejuv column (no cooldown).
# With the column EMPTY and this many hostiles this close, escalate
# straight to blood warp.
rejuv_below_pct = 50.0
escalate_hostiles = 2
escalate_radius = 10

# Rung 4 — blood warp, escape only, never traversal (R47.3). Trigger:
# packed in (warp_hostiles within warp_radius AND hp below warp_hp_pct),
# or burst down (more than warp_loss_pct of max hp lost within
# warp_loss_window_s). Guards: the cast costs 10 mana and
# max(warp_cost_pct of max hp, warp_cost_floor) hp — never cast without
# warp_min_mana mana or with hp at or below twice the hp cost.
warp_hostiles = 4
warp_radius = 8
warp_hp_pct = 60.0
warp_loss_pct = 25.0
warp_loss_window_s = 2.0
warp_min_mana = 10
warp_cost_pct = 12.0
warp_cost_floor = 12
# The warp's own cooldown is unknown-length, so it is verified by effect:
# an attempt that moved the player warp_verify_move subtiles landed; until
# then, re-casts are blocked for warp_retry_s.
warp_verify_move = 10
warp_retry_s = 2.0
# Where to flee: a walkable spot this far from the hostile centroid.
retreat_distance = 20
# Which skills the two casting rungs use (names from [skills] above).
escape_skill = "blood_warp"
armor_skill = "bone_armor"

# Rung 5 — healing potion: below this hp%, drink a healing column, at
# most once per heal_cooldown_s. The second healing column is the backup.
# 75 is the R241 choice: drink when meaningfully hurt, not to top up
# after every scratch (was 100.0 until 2026-08-09).
heal_below_pct = 75.0
heal_cooldown_s = 10.0

# Rung 6 — mana potion: below this mana%, at most once per
# mana_cooldown_s (15 s — the R49 amendment; was proposed at 5).
mana_below_pct = 25.0
mana_cooldown_s = 15.0

# Rung 6.5 — reposition (R176 Q3, user-approved numbers): losing at
# least reposition_loss_pct of max hp within reposition_window_s while
# having moved less than reposition_still_subtiles = step reposition_step
# subtiles away (from the hostiles when any are visible; ground fire has
# no unit to see, so the trigger never asks WHAT is doing the damage).
# Paced by reposition_cooldown_s. Sits below the potion/warp rungs:
# emergencies get the emergency answers first.
reposition_loss_pct = 2.0
reposition_window_s = 2.5
reposition_still_subtiles = 3
reposition_step = 10
reposition_cooldown_s = 2.0

# Rung 7 — disengage: bone armor down AND still on recast cooldown AND hp
# below this: retreat from the pack instead of trading hits unarmored.
disengage_hp_pct = 70.0

# Rung 7.5 — merc first aid (R179, the user's numbers): merc alive and
# below merc_heal_below_pct of its hp, with a healing potion anywhere in
# the belt -> Shift+<column key> feeds it one (the chord is SHIFT, not
# Alt — corrected at R183 after T54 run 2 fed the player three times).
# Sits BELOW every player-survival rung (the merc gets a potion only on
# a tick the player needed nothing) and is paced by merc_heal_retry_s.
# Never in town — the preamble's Akara visit heals the merc for free.
merc_heal_below_pct = 50.0
merc_heal_retry_s = 3.0

# Rung 7.6 — belt-bottom hygiene (user rules, 2026-08-02). The keys only
# reach the BOTTOM row, so the contract is: when the belt's contents
# allow, one healing + one mana + one rejuv at column bottoms; foreign
# potions (antidotes, thawing) drunk clear; and at most
# mana_glut_bottom_max columns with mana at the bottom (squatting columns
# drunk first). Rejuv bottoms are never spent on tidiness. One pacing
# (mana_glut_retry_s) serves all three repairs.
mana_glut_bottom_max = 1
mana_glut_retry_s = 2.0

# Rung 8 — upkeep: recast bone armor when its remaining absorb falls
# below armor_recast_below_pct (fallback when the stat is unreadable:
# recast after being hit, R47.2). armor_retry_s paces attempts, since the
# real cooldown cannot be read. armor_in_town lets the recast happen in
# town too (castable there, proven live in P2; arriving armored is
# strictly better). Desecrate/revive upkeep is the combat module's and
# never runs in town (R47.4).
armor_recast_below_pct = 75.0
armor_retry_s = 2.0
armor_in_town = true

# The skirmish pattern, in the user's own words (R47.2): "on contact, wait
# briefly for revives to engage -> dash in -> left-click the monster ->
# run back out of danger -> recast bone armor if low -> repeat until the
# pack is dead." The numbers below are the parts that description leaves
# open; they are judgment calls, tune them freely.
#
# Offense itself has no knobs: the left skill is permanently Poison
# Strike, so an attack is a left-click on the monster (R47.1).
[combat]
# Hostiles within engage_radius mean "we are in a fight". melee_range is
# close enough to strike. The dash happens in hops of at most dash_step
# subtiles rather than one long walk — a blocking walk into a pack is
# time the survival ladder is NOT being consulted, and the ladder is what
# keeps this character alive.
engage_radius = 40
melee_range = 3
dash_step = 8
# How far out the CHARGE style (berserk) attacks directly instead of
# dashing (R259, 2026-08-13): an attack-click walks the character in
# via the client's own unit-aware pathing — manual move-clicks cannot
# push through monster collision (run 1 of the T92 battery: 88 blocked
# dashes, 183 s). 16 stays inside the nearest screen edge (T50: 19-38).
# Only styles with style = "charge" read this; skirmish strikes at
# melee_range as always.
charge_attack_range = 16
# How far back out of the pack after each strike.
retreat_subtiles = 12
# Poison does the killing, so a struck monster is already dying: prefer
# fresh targets and only re-hit a survivor after this long.
# Lowered from 6.0, then again to 1.0, both times after the user watched
# a live run: the necro spent whole seconds standing still because every
# nearby hostile was inside its restrike window. Their judgement, and it
# overrides the original let-poison-work theory: standing still is the
# riskier option, and "duck in for a click, run away, move often" is the
# pattern this number was throttling (R163).
restrike_s = 1.0
# A small step taken instead of standing still when there is nothing
# fresh to hit, or while waiting for the revive wall. It is taken
# sideways rather than backwards when backing off would leave the fight
# — standing still is the option the user has twice called dangerous.
reposition_subtiles = 4
# How far a ground-targeted cast (desecrate) stays clear of a CLICKABLE
# object — a waypoint, the stash. Wider than the 2 subtiles used for
# monsters and summons, because the sprite is bigger and the mistake is
# worse: a right-click on a waypoint opens its menu, which blocks every
# send until something closes it. Stage B's tenth attempt died that way,
# casting 4 subtiles from the waypoint it had just arrived on.
object_clearance = 6

# Revives as aggro tanks. On contact, hold up to wait_for_revives_s for
# them to get in front — the wait ends early once one of them is within
# revive_engaged_range of a hostile, since it is waiting for them to
# TANK, not waiting out a timer.
wait_for_revives_s = 0.8
revive_engaged_range = 8
# Keep this many revives up (R47.4). They last ~300 s; the count is
# re-checked every tick, so expiry heals itself.
revive_target = 3
# How many revives must be up before OFFENSE may advance. A different
# question from revive_target above — that one is how many upkeep keeps
# standing — and holding offense back for the FULL wall meant waiting
# through two desecrates and three revive casts before the first dash,
# which is most of why the bot looked so passive (R163). One tank in
# front is enough to stop being the closest target; upkeep builds the
# rest while the fight is already on.
approach_with_revives = 1
# Corpses this close count as revive fuel.
revive_search_radius = 15
# Desecrate makes corpses. Bounded: if it produces none (nothing died
# nearby, skill on cooldown), stop after this many rounds rather than
# recasting forever — every one of those ticks is a tick not fighting.
# The settle delays stop the bot re-casting before the last cast resolved.
desecrate_rounds = 2
# Strikes on ONE unit that move neither its health nor our mana before it
# stops being a target (T72, 2026-08-06). That run put 23 strikes each
# into two decorative bats over 173 seconds and nothing in the code could
# notice. Two readings, both required: a poison strike costs mana, so
# mana that does not move means the strike never connected at all, while
# mana spent with the target's health static means it landed and has not
# shown yet. NEITHER is permanent: Hell "immunity" is 100% resistance,
# not invulnerability, and this character pierces poison resistance while
# the merc's Pus Spitter casts Lower Resist on striking. Raise this if
# tough-but-killable monsters are being abandoned; the write-off already
# expires the instant a target's health moves.
futile_strikes = 4
desecrate_settle_s = 1.0
revive_settle_s = 0.6
# A budget burned against desecrate's own cooldown refreshes after this
# long (M6 P3, user: 3 revives up matters — the bot dilly-dallied). In
# combat only (the quiet-field gate still stops empty-field churn);
# 0 disables the refresh.
desecrate_budget_refresh_s = 8.0
# While the wall is short and a wall cast is actively resolving, strikes
# and dashes hold (drift only) so the desecrate->revive casts get the
# cast pipeline to themselves — strike CLICKS colliding with cast
# animations were what made the wall build slow (M6 P3, user note 1.5).
revive_urgency_hold = true
# After the last right-skill cast of a burst, the executor switches back
# to the armor hotkey once this grace passes with no further cast (M6
# P3, user note 1): an active Revive right skill makes ground corpses
# selectable, which interferes with pathing and item pickup.
park_grace_s = 2.0
# Posture switches (M6 P3, R212 Q5). These two ARE the cautious posture;
# the named presets below override them per run step.
#   linger: drift near poisoned monsters rather than moving on. false =
#   brisk's "brush past them toward the target".
linger = true
#   retreat_group_size 0 = back out after EVERY strike (the cautious
#   skirmish beat). N>0: retreat only when >=N hostiles stand within
#   retreat_group_radius — isolated enemies get struck without the
#   back-out, a closing group still triggers the full retreat.
retreat_group_size = 0
retreat_group_radius = 8
# Which skills the maintenance uses (names from [skills] above).
desecrate_skill = "desecrate"
revive_skill = "revive"

# The posture every game STARTS in (R256 QA, operator ruling 2026-08-13):
# "switch the bot's default combat behavior to Berserk, henceforth. We
# may shelve the skirmish stance entirely; for the foreseeable future,
# please set Berserk as the default posture. I'm fairly convinced that
# it's not just the fastest, but the safest too (best defense is a good
# offense)." Measured basis: T92 — the skirmish beat's retreat-dash
# cycle dominated the 8.3x human-vs-bot gap (combat exposure 388 s of
# 454). The cautious base and the skirmish beat above stay DEFINED —
# run steps may still name any posture per step — but nothing selects
# them by default anymore. Remove this line to fall back to cautious.
default_posture = "berserk"

# Named combat postures (M6 P3, R212 Q5): override tables over the
# [combat] numbers above. "cautious" is the base itself and cannot be
# redefined. Run steps select a posture per step (runs/countess.toml:
# brisk for the descent, aggressive on Cellar 5); a step naming none
# leaves the module in whatever posture it already holds (cautious at
# game start). Every number here is a first-guess judgment call —
# tune in the P5 battery like every M5 number was.

[combat.postures.brisk]
# Fight only what obstructs passage (the user's Q4): a tight engagement
# bubble around the moving character IS the route corridor, and with
# linger off the run keeps walking the moment nothing blocks it.
engage_radius = 12
linger = false
retreat_subtiles = 8

[combat.postures.aggressive]
# Attack whenever safely feasible, especially isolated enemies; still
# back off from groups that close in (the user's own definition).
restrike_s = 0.5
retreat_group_size = 3
wait_for_revives_s = 0.5

# -- the route leash (R241) ----------------------------------------------------
# When a run step has a recorded route line (maps/<seed>/line-<area>.json,
# recorded by walking it once with drills/t84_record_line.py), the step
# reports and corrects drift from that line.
[route]
# Farther than this from the line counts as strayed (subtiles).
stray_subtiles = 12.0
# Non-brisk postures wait until no living hostile is within this radius
# before walking back to the line; brisk returns immediately.
return_hostile_radius = 12

# Berserk (R241): the charge style — always attack the nearest visible
# enemy with the dagger, no dash-out, no waiting for the wall. The
# reflex ladder still owns survival (potions, escapes), with the armor
# recast tightened to 60%. Returns to a route line only when nothing
# hostile is nearby (the traverse leash's default wait).
[combat.postures.berserk]
style = "charge"
armor_recast_below_pct = 60.0
restrike_s = 0.5
linger = true
